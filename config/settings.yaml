app:
  name: secure-local-ai-assistant
  data_dir: ./data
  max_context_chars: 4000
  chunk_size: 500
  chunk_overlap: 80
  top_k: 5

inference:
  device: cpu          # cpu | auto (gpu only if available)
  gpu_backend: vulkan   # none | vulkan | metal | rocm  (never cuda/cudnn)
  n_gpu_layers: 0      # 0 = CPU only; -1 = offload all (when gpu available)

llm:
  provider: ollama
  model: qwen2.5:3b-instruct-q4_K_M
  base_url: http://localhost:11434
  temperature: 0.2
  max_tokens: 512
  timeout: 120
  num_gpu: 0

embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2
  device: cpu

retrieval:
  index_path: ./data/index/faiss.index
  metadata_path: ./data/index/metadata.json
